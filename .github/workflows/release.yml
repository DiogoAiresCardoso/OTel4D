name: Release OTel4D
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release tag
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag-object: ${{ steps.tag.outputs.tag_object }}
      draft: ${{ steps.tag.outputs.draft }}
    steps:
      - name: Check out the version and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the annotated version on main
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            echo '::error::Use a release tag of the form vMAJOR.MINOR.PATCH.'
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF")" != tag ]]; then
            echo '::error::The release tag must be annotated.'
            exit 1
          fi
          tag_object="$(git rev-parse "$GITHUB_REF")"
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          if [[ "$commit" != "$(git rev-parse "$GITHUB_SHA^{commit}")" ]] ||
             ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo '::error::The tagged commit must match the push event and belong to main.'
            exit 1
          fi
          test -s LICENSE
          draft=false
          if grep -Fxq 'License decision pending' LICENSE; then
            draft=true
          fi
          printf 'tag_object=%s\ndraft=%s\n' "$tag_object" "$draft" >> "$GITHUB_OUTPUT"
      - name: Run repository checks
        run: |
          python3 tools/check_project.py
          python3 -m unittest discover -s tests -p 'test_*.py'

  release:
    name: Create the source release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
          KEEP_DRAFT: ${{ needs.validate.outputs.draft }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          current_tag="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          if [[ "$current_tag" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo '::error::The release tag changed after validation.'
            exit 1
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if gh release view "$tag" --repo "$repo" --json tagName > /dev/null 2>"$error_file"; then
            echo 'The GitHub Release for this tag already exists.'
            exit 0
          fi
          if ! grep -Fxq 'release not found' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$repo" --verify-tag --title "OTel4D $tag" \
            --generate-notes --draft="$KEEP_DRAFT"
